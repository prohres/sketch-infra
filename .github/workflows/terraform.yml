name: terraform

on:
  pull_request:
    branches: [develop]

# A newer push to the same PR supersedes the running plan
concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {} # nothing by default; the job below grants only what the template needs

# Account ids are repo variables (Settings → Variables), not code: the repo is public.
jobs:
  plan:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: prohres/ci-templates/.github/workflows/tf-plan.yml@v1
    with:
      stacks: '["org", "identity"]' # bootstrap/ and ci/ are applied manually only
      changed-only: true
      stack-paths: '{"org": ["policies/"]}' # org reads SCP JSON from ../policies
      gha-role-arn: arn:aws:iam::${{ vars.CI_ACCOUNT_ID }}:role/gha-plan
      target-role-arn: arn:aws:iam::${{ vars.ROOT_ACCOUNT_ID }}:role/org-tf-plan
      target-account-id: ${{ vars.ROOT_ACCOUNT_ID }}
      backend-bucket: sketch-tfstate-${{ vars.ROOT_ACCOUNT_ID }}
