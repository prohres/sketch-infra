name: terraform-apply

on:
  push:
    branches: [develop]

# One apply pipeline at a time: a newer merge waits (its plan must see the previous apply).
# A run still pending when an even newer one arrives is cancelled — fine, the newest plan covers it.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

permissions: {}

# Account ids are repo variables (Settings → Variables), not code: the repo is public.
jobs:
  apply:
    permissions:
      contents: read
      id-token: write
    uses: prohres/ci-templates/.github/workflows/tf-apply.yml@v1
    with:
      stacks: '["org", "identity"]' # bootstrap/ and ci/ are applied manually only
      plan-gha-role-arn: arn:aws:iam::${{ vars.CI_ACCOUNT_ID }}:role/gha-plan
      plan-target-role-arn: arn:aws:iam::${{ vars.ROOT_ACCOUNT_ID }}:role/org-tf-plan
      apply-gha-role-arn: arn:aws:iam::${{ vars.CI_ACCOUNT_ID }}:role/gha-apply
      apply-target-role-arn: arn:aws:iam::${{ vars.ROOT_ACCOUNT_ID }}:role/org-tf-apply
      target-account-id: ${{ vars.ROOT_ACCOUNT_ID }}
      plan-bucket: sketch-tfplans-${{ vars.ROOT_ACCOUNT_ID }}
      backend-bucket: sketch-tfstate-${{ vars.ROOT_ACCOUNT_ID }}
      plan-prefix: sketch-infra
      environment: org-apply # required reviewer; gha-apply trusts only this environment
