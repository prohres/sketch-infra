name: terraform-drift

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC; runs on the default branch only
  workflow_dispatch:

# Read-only: a newer check supersedes a running one
concurrency:
  group: terraform-drift
  cancel-in-progress: true

permissions: {}

# Account ids are repo variables (Settings → Variables), not code: the repo is public.
jobs:
  drift:
    permissions:
      contents: read
      id-token: write
      issues: write # open / update / close drift issues
    uses: prohres/ci-templates/.github/workflows/tf-drift.yml@v1
    with:
      stacks: '["org", "identity"]' # bootstrap/ and ci/ are applied manually only
      gha-role-arn: arn:aws:iam::${{ vars.CI_ACCOUNT_ID }}:role/gha-plan
      target-role-arn: arn:aws:iam::${{ vars.ROOT_ACCOUNT_ID }}:role/org-tf-plan
      target-account-id: ${{ vars.ROOT_ACCOUNT_ID }}
      backend-bucket: sketch-tfstate-${{ vars.ROOT_ACCOUNT_ID }}
